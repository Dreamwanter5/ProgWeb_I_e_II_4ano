<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filtro de Produtos</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <style>
      .card {
        transition: transform 0.3s;
      }
      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      }
      .price {
        color: #198754;
        font-weight: bold;
      }
      .filter-section {
        background-color: #f8f9fa;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
      }
      .product-card {
        margin-bottom: 20px;
      }
    </style>
    <script src="https://unpkg.com/petite-vue" defer></script>
    <script src="makeup.js"></script>
  </head>
  <body>
    <header class="bg-primary text-white py-4 mb-4">
      <div class="container">
        <h1 class="text-center">
          <i class="bi bi-grid-3x3-gap"></i> Requisições Assíncronas
        </h1>
      </div>
    </header>

    <div class="container" v-scope="app">
      <div class="row">
        <!-- Filtros -->
        <div class="col-md-3">
          <div class="filter-section sticky-top" style="top: 20px">
            <h4 class="border-bottom pb-2">Filtros</h4>

            <div class="mb-3">
              <label for="searchInput" class="form-label">Buscar produto</label>
              <input
                type="text"
                class="form-control"
                id="searchInput"
                placeholder="Digite o nome..."
              />
            </div>

            <div class="mb-3">
              <label for="typeFilter" class="form-label">Tipo</label>
              <select class="form-select" id="typeFilter" v-model="formData.tipo">
                <option value="">Todos os tipos</option>
                <option v-for="tipo in tipos" :value="tipo" :key="tipo" >{{ tipo }}</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="categoryFilter" class="form-label">Marcas</label>
              <select class="form-select" id="categoryFilter" v-model="formData.marca">
                <option value="">Todas as Marcas</option>  
                <option v-for="marca in marcas" :value="marca">{{marca}}</option>              
              </select>
            </div>

            <!-- Filtrando preços -->
            <div class="mb-3">
              <label for="maxPrice" class="form-label">Preço Máximo</label>
              <input type="number" class="form-control" id="maxPrice" placeholder="Exemplo: 0,01 centavos" min="0" step="0.01" v-model="formData.precoMax">
            </div>

            <!-- Filtrando avaliação -->
             <div class="mb-3">
              <label for="minRating" class="form-label">Avaliação Mínima</label>
              <input type="number" class="form-control" id="minRating" placeholder="Ex: 4" min="0" max="5" step="0.1" v-model="formData.avaliacaoMin">
            </div>

            <div class="mb-3">
              <label for="priceRange" class="form-label"
                >Faixa de preço: R$ <span id="priceValue">500</span></label
              >
              <input
                type="range"
                class="form-range"
                min="0"
                max="1000"
                step="50"
                value="500"
                id="priceRange"
              />
            </div>

            <!-- Fim parte do preço -->

            <button class="btn btn-outline-secondary w-100" @click="filtrar">
              <i class="bi bi-search"></i> Filtrar produtos
            </button>
          </div>
        </div>

        <!-- Lista de Produtos -->
        <div class="col-md-9">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h4>
              Produtos
              <span class="badge bg-primary" id="productCount">{{produtos.length}}</span>
            </h4>
            <div>
              <select
                class="form-select form-select-sm"
                id="sortSelect"
                style="width: auto; display: inline-block"
              >
                <option value="name">Ordenar por nome</option>
                <option value="priceAsc">Preço: menor para maior</option>
                <option value="priceDesc">Preço: maior para menor</option>
              </select>
            </div>
          </div>

          <div class="row" id="productList">

            <div v-for="produto in produtos"  class="col-sm-6 col-lg-4 product-card">
              <div class="card h-100">
                <img
                    :src="produto.image_link"
                    class="card-img-top"
                    alt="Notebook Gamer"
                />
                <div class="card-body">
                    <h5 class="card-title">{{produto.name}}</h5>
                    <div class="rating mb-2">
                  <template v-if="produto.rating">
                    <i class="bi bi-star-fill text-warning"></i>
                    <span class="ms-1">{{ produto.rating.toFixed(1) }}</span>
                  </template>
                  <span v-else class="text-muted">Sem avaliação</span>
                </div>
                  <div class="d-flex justify-content-between align-items-center">
                    <span class="price">$ {{produto.price}}</span>
                    <span class="badge bg-secondary"> {{produto.product_type}}</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/booscript.bundle.min.js"></script>
  </body>
</html>
