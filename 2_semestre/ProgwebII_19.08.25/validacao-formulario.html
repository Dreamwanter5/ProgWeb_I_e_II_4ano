
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow p-4">
            <h3 class="text-center mb-4">Cadastro de Usuário</h3>

            <form id="formCadastro" onsubmit="enviarDados(event)">
              <!-- Nome -->
              <div class="mb-3">
                <label for="nome" class="form-label">Nome completo</label>
                <input type="text"
                 class="form-control" 
                 id="nome" 
                 required
                 onblur="validarNome()" />
                <div class="invalid-feedback" id="erroNome"></div>
                <!-- <div class="valid-feedback"></div> -->
              </div>

              <!-- CPF -->
              <div class="mb-3">
                <label for="cpf" class="form-label">CPF</label>
                <input
                  type="text"
                  class="form-control"
                  id="cpf"
                  pattern="\d{11}"
                  required
                  onblur="validarCPF()"
                />
                <div class="invalid-feedback" id="erroCpf"></div>
              </div>

              <!-- E-mail -->
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" 
                class="form-control" 
                id="email" 
                required
                onblur="validarEmail()" />
                <div class="invalid-feedback" id="erroEmail"></div>
              </div>

              <!-- Senha -->
              <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input
                  type="password"
                  class="form-control"
                  id="senha"
                  minlength="6"
                  required
                  onblur="validarSenha()"
                />
                <div class="invalid-feedback" id="erroSenha">
                </div>
              </div>

              <!-- Confirmar Senha -->
              <div class="mb-3">
                <label for="confirmarSenha" class="form-label"
                  >Confirmar Senha</label
                >
                <input
                  type="password"
                  class="form-control"
                  id="confirmarSenha"
                  required
                  onblur="validarSenha()"
                />
                <div class="invalid-feedback" id="erroConfirmSenha"></div>
              </div>

              <!-- Telefone -->
              <div class="mb-3">
                <label for="telefone" class="form-label">Telefone</label>
                <input
                  type="tel"
                  class="form-control"
                  id="telefone"
                  pattern="\d{10,11}"
                  required
                  onblur="validarTelefone()"
                />
                <div class="invalid-feedback" id="erroTelefone">
                </div>
              </div>

              <!-- Data de Nascimento -->
              <div class="mb-3">
                <label for="dataNascimento" class="form-label"
                  >Data de Nascimento</label
                >
                <input
                  type="date"
                  class="form-control"
                  id="dataNascimento"
                  required
                  onblur="validarData()"
                />
                <div class="invalid-feedback" id="erroDataNascimento">
                </div>
              </div>

              <!-- Endereço -->
              <h5 class="mt-4">Endereço</h5>
              <div class="row">
                <div class="col-md-8 mb-3">
                  <label for="rua" class="form-label">Rua</label>
                  <input type="text" class="form-control" id="rua" required onblur="validarRua()"/>
                  <div class="invalid-feedback" id="erroRua"></div>
                </div>
                <div class="col-md-4 mb-3">
                  <label for="numero" class="form-label">Número</label>
                  <input
                    type="text"
                    class="form-control"
                    id="numero"
                    required
                    onblur="validarNumero()"
                  />
                  <div class="invalid-feedback" id="erroNumero"></div>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="bairro" class="form-label">Bairro</label>
                  <input
                    type="text"
                    class="form-control"
                    id="Bairro"
                    required
                    onblur="validarBairro()"
                  />
                  <div class="invalid-feedback" id="erroBairro"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="cidade" class="form-label">Cidade</label>
                  <input
                    type="text"
                    class="form-control"
                    id="Cidade"
                    required
                    onblur="validarCidade()"
                  />
                  <div class="invalid-feedback" id="erroCidade"></div>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="estado" class="form-label">Estado</label>
                  <select class="form-select" id="Estado" required onblur="validarEstado()">
                    <option value="">Selecione...</option>
                    <option value="PR">Paraná</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                  </select>
                  <div class="invalid-feedback" id="erroEstado"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="cep" class="form-label">CEP</label>
                  <input
                    type="text"
                    class="form-control"
                    id="Cep"
                    pattern="\d{8}"
                    required
                    onblur="validarCep()"
                  />
                  <div class="invalid-feedback" id="erroCep">
                  </div>
                </div>
              </div>

              <!-- Aceite -->
              <div class="form-check mb-3">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="Termos"
                  required
                  onblur="validarTermos()"
                />
                <label class="form-check-label" for="Termos">
                  Aceito os termos e condições
                </label>
                <div class="invalid-feedback" id="erroTermos"></div>
              </div>

              <button type="submit" class="btn btn-primary w-100">
                Cadastrar
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>

   <script src="validacao-formulario.js"></script>
  </body>
</html>
