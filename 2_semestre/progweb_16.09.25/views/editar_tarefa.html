<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edição - Sistema de Tarefas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
  </head>
  <body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">
          <i class="bi bi-check2-square me-2"></i>Sistema de Tarefas
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="dashboard.html">
                <i class="bi bi-speedometer2 me-1"></i>Dashboard
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cadastro_tarefa.html">
                <i class="bi bi-plus-circle me-1"></i>Nova Tarefa
              </a>
            </li>
          </ul>
          <div class="navbar-nav">
            <span class="navbar-text me-3">
              <i class="bi bi-person-circle me-1"></i>Usuário Logado
            </span>
            <a class="btn btn-outline-light btn-sm" href="#">
              <i class="bi bi-box-arrow-right me-1"></i>Sair
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card">
            <div class="card-header bg-primary text-white">
              <h5 class="card-title mb-0">
                <i class="bi bi-pencil me-2"></i>Editar Tarefa
              </h5>
            </div>
            <div class="card-body">
              <form>
                <!-- Nome da Tarefa -->
                <div class="mb-3">
                  <label for="nomeTarefa" class="form-label"
                    >Nome da Tarefa <span class="text-danger">*</span></label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="nomeTarefa"
                    value="Relatório mensal"
                    required
                  />
                </div>

                <!-- Tipo de Tarefa -->
                <div class="mb-3">
                  <label for="tipoTarefa" class="form-label"
                    >Tipo de Tarefa <span class="text-danger">*</span></label
                  >
                  <select class="form-select" id="tipoTarefa" required>
                    <option value="pessoal">Pessoal</option>
                    <option value="profissional" selected>Profissional</option>
                    <option value="educacional">Educacional</option>
                    <option value="saude">Saúde</option>
                    <option value="casa">Casa</option>
                    <option value="outro">Outro</option>
                  </select>
                </div>

                <!-- Data Prevista -->
                <div class="mb-3">
                  <label for="dataPrevista" class="form-label"
                    >Data Prevista de Finalização
                    <span class="text-danger">*</span></label
                  >
                  <input
                    type="date"
                    class="form-control"
                    id="dataPrevista"
                    value="2024-03-20"
                    required
                  />
                </div>

                <!-- Descrição -->
                <div class="mb-3">
                  <label for="descricao" class="form-label"
                    >Descrição da Tarefa</label
                  >
                  <textarea class="form-control" id="descricao" rows="3">
Preparar relatório financeiro do mês de março para apresentação na reunião de diretoria.</textarea
                  >
                </div>

                <!-- Imagem de Ajuda -->
                <div class="mb-3">
                  <label for="imagemAjuda" class="form-label"
                    >Imagem de Ajuda</label
                  >
                  <input
                    type="file"
                    class="form-control"
                    id="imagemAjuda"
                    accept="image/*"
                  />
                  <div class="form-text">
                    Imagem atual: <a href="#">relatorio_modelo.jpg</a>
                  </div>
                </div>

                <!-- Status -->
                <div class="mb-4">
                  <label class="form-label">Status</label>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="concluida"
                    />
                    <label class="form-check-label" for="concluida">
                      Tarefa concluída
                    </label>
                  </div>
                </div>

                <!-- Botões -->
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                  <a href="index.html" class="btn btn-secondary me-md-2">
                    <i class="bi bi-arrow-left me-1"></i>Voltar
                  </a>
                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i>Salvar Alterações
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-light mt-5 py-4">
      <div class="container">
        <div class="row">
          <div class="col-md-6">
            <h5>Sistema de Tarefas</h5>
            <p class="mb-0">
              Organize suas tarefas de forma simples e eficiente
            </p>
          </div>
          <div class="col-md-6 text-md-end">
            <p class="mb-0">
              &copy; Sistema de Tarefas. Todos os direitos reservados.
            </p>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
