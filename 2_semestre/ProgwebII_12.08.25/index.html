<!-- Código de cadastro de usuário simples feito pelo professor e disponibilizado no classroom -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous" defer></script>
    <script src="https://unpkg.com/petite-vue" defer></script>
    <script src="revisao_com_vue.js" defer></script>

    <link rel="icon" type="enxada.png" href="touhou-cirno.gif">

    <!-- O "Defer" serve para aplicar uma alteração sutil mas fundamental. Ele faz com que o o programa leia o código em ordem, mas só execute o javascript no final. Serve para melhor estruturar a organização do código. -->
  </head>
  <body class="vw-100 vh-100 bg-light">
    <div class="h-100 container d-flex flex-column justify-content-center">
      <h1 class="text-center mb-3">Cadastro de Usuário</h1>
      <form v-scope="app" onsubmit="enviarDados(event)">
        <div class="form-floating mb-3">
          <input
            type="text"
            class="form-control"
            id="nome"
            placeholder="Seu nome"
            v-model="formData.nome"
          />
          <label for="floatingInput">Nome</label>
          <div class="valid-feedback">Nome válido!</div>
        </div>
        <div class="form-floating mb-3">
          <input
            type="text"
            class="form-control"
            id="email"
            placeholder="email@google.com"
            v-model = "formData.email"
          />
          <label for="floatingInput">Email</label>
          <div class="invalid-feedback">Email inválido!</div>
        </div>
        <div class="form-floating mb-3">
          <input type="date" class="form-control" id="data_nascimento" v-model="formData.dataNascimento"/>
          <label for="floatingInput">Data de Nascimento</label>
          <div class="invalid-feedback" id="data">
            Escolha uma data anterior à data atual!
          </div>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="senha" @blur="validarSenha" v-model="formData.senha" :class="{'is-invalid' : erros.senha}"/>
          <label for="floatingInput">Senha</label>
          <div class="invalid-feedback" id="erroSenha">{{errors.senha}}</div>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="confirmarSenha" @blur="confirmSenha" v-model="formData.confirmSenha" :class="{'is-invalid' :erros.confirmSenha}" />
          <label for="floatingInput">Confirmar senha</label>
          <div class="invalid-feedback" id="erroConfirmarSenha">{{errors.senha}}</div>
        </div>
        <div class="mb-3 d-flex justify-content-evenly">
          <a class="btn btn-secondary" href="#" role="button">Login</a>
          <button type="submit" class="btn btn-primary">Cadastrar</button>
        </div>
      </form>
    </div>
    
  </body>
</html>
