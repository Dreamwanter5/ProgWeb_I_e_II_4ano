<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Usuário</title>
  <link rel="stylesheet" href="css.css" />
  <script src="https://unpkg.com/petite-vue" defer></script>
  <script src="js/cadastro_usuario.js" defer></script>
</head>

<body>
  <div class="container" v-scope="FormApp">
    <h2>Cadastro</h2>
    <form action="../Controllers/UsuarioController.php" method="post" @submit.prevent="enviarRequisicao">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required v-model="formData.nome" />

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required v-model="formData.email" />

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" required v-model="formData.senha" />

      <label for="data_nascimento">Data de Nascimento:</label>
      <input type="date" id="data_nascimento" name="data_nascimento" required v-model="formData.data" />
      <span class="error" v-if="errors.data">{{errors.data}}</span>

      <button type="submit">Cadastrar</button>
    </form>

  </div>
</body>

</html>
